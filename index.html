<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rule of Three Calculator</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --border: #e5e7eb;
      --bar: #9ca3af;
      --radius: 8px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 480px;
      margin: 4rem auto;
      padding: 0 1rem;
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: 1.75rem;
      text-align: center;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem 2rem;
    }

    .cell {
      display: flex;
      align-items: center;
    }

    .cell input,
    .cell .answer {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1.125rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
      background: var(--card);
    }

    .cell input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }

    .cell.top input {
      border-color: transparent;
      border-bottom: 2px solid var(--bar);
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .cell.bottom .answer {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
      cursor: default;
    }

  </style>
</head>
<body>
  <main>
    <h1>Rule of Three</h1>

    <div class="card">
      <div class="grid">
        <div class="cell top">
          <input id="a" type="number" inputmode="decimal" autocomplete="off" placeholder="2" aria-label="a" autofocus />
        </div>
        <div class="cell top">
          <input id="c" type="number" inputmode="decimal" autocomplete="off" placeholder="5" aria-label="c" />
        </div>
        <div class="cell bottom">
          <input id="b" type="number" inputmode="decimal" autocomplete="off" placeholder="4" aria-label="b" />
        </div>
        <div class="cell bottom">
          <div class="answer" id="answer" aria-live="polite">10</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      const aInput = document.querySelector("#a");
      const bInput = document.querySelector("#b");
      const cInput = document.querySelector("#c");
      const answer = document.querySelector("#answer");

      function parse(input) {
        const value = parseFloat(input.value);
        return Number.isFinite(value) ? value : null;
      }

      function format(value) {
        return Number.isInteger(value) ? String(value) : String(parseFloat(value.toFixed(6)));
      }

      function compute() {
        const a = parse(aInput);
        const b = parse(bInput);
        const c = parse(cInput);

        if (a === null || b === null || c === null) {
          answer.textContent = "x";
          return;
        }

        if (a === 0) {
          answer.textContent = "—";
          return;
        }

        answer.textContent = format((b * c) / a);
      }

      [aInput, bInput, cInput].forEach((input) =>
        input.addEventListener("input", compute)
      );

      compute();
    })();
  </script>
</body>
</html>
